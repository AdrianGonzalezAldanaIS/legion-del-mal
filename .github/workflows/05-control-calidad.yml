name: Control de Calidad

on:
    push:
        branches: [ "main" ]
    pull_request:
        branches: [ "main" ]

jobs:
    control-calidad:
        revision-contenido:
            runs-on: ubuntu-latest

            steps:
                - name: Braibiac accede a los planes
                  uses: actions/checkout@v4
                - name: El consejo revisa los cambios
                  run: |
                    chmod +x scripts/validar-planes.sh
                    ./scripts/validar-planes.sh