# This is a basic workflow to help you get started with Actions

name: Comunicador de la Legión

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  # push:
  #   branches: [ "main" ]
  # pull_request:
  #   branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
        villano:
          description: 'Qué villano cenvía el mensaje?'
          required: true
          type: choice
          options:
            - Lex Luthor
            - Brainiac
            - Joker
            - Darkseid
            - Sinestro

        mensaje:
          description: 'Mensaje para el consejo'
          required: true
          default: 'La misión fue un éxito'

        prioridad:
          description: 'Nivel de prioridad'
          required: true
          type: choice
          options:
            - ⚫ Normal
            - ⚫ Alta
            - ⚫ Critica
        
        cow_character:
          description: 'Personaje de la vaca'
          required: true
          type: choice
          options:
            - eyes
            - tux
            - dragon
            - ghostbusters
            - vader
            - bunny
            - cheese
            - moose
            - stegosaurus

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  transmitir-mensaje:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it

      - name: Instalar el transmisor de la Legión
        run: sudo apt-get install -y cowsay

      - name: Imprimir inputs
        run: |
          echo "Inputs: "
          echo ""
          echo "================================"
          echo " TRANSMISIÓN INGERCEPTADA "
          echo "================================"
          echo ""
          echo "De: ${{ inputs.villano }}"
          echo ""
          echo "Fecha: $(date -u +"%d-%m-%Y - %H:%M UTC")"
          echo "_____ Mensaje______"
          cowsay -f "${{ inputs.cow_character }}" "${{ inputs.mensaje }}"
          echo ""
          echo "__ ${{ inputs.villano }} __"
          echo "..."